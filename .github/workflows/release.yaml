name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # The tag path startup-failed with ZERO jobs until 2026-09-12: this repo's
  # Actions policy allows actions/* and verified creators only, and the publish
  # job used softprops/action-gh-release (third-party) -- a disallowed action
  # refuses the whole workflow at STARTUP, which is what a 0-job failure is.
  # The release is created with the preinstalled gh CLI instead, so every
  # `uses:` in this file is actions/*.
  #
  # workflow_dispatch runs the full build + install-smoke matrix WITHOUT
  # publishing: the publish job is tag-gated, and the tag/version check is
  # skipped — a dispatch is how the smoke itself gets exercised.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require distributable, licensed assets
        run: npm run assets:release
      - name: Require tag to match package version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-tag.cjs "${GITHUB_REF_NAME}"

  package:
    name: Package ${{ matrix.name }}
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: linux
            runner: ubuntu-latest
            artifact: desk-linux-x64
            command: npm run dist:linux
          - name: Windows x64
            platform: windows
            runner: windows-latest
            artifact: desk-windows-x64
            command: npm run dist:windows
          - name: macOS arm64
            platform: macos
            runner: macos-15
            artifact: desk-macos-arm64
            command: npm run dist:mac -- --arm64
          - name: macOS x64
            platform: macos
            runner: macos-15-intel
            artifact: desk-macos-x64
            command: npm run dist:mac -- --x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and test
        run: npm run lint && npm test
      - name: Build native installer
        run: ${{ matrix.command }}
      - name: Smoke test the installed app
        if: matrix.platform == 'linux'
        timeout-minutes: 10
        run: |
          set -e
          sudo dpkg -i release/*.deb || sudo apt-get -y -f install
          test -x /opt/Desk/desk
          xvfb-run -a /opt/Desk/desk --no-sandbox --disable-gpu --smoke
      - name: Smoke test the installed app
        if: matrix.platform == 'windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/Desk-*-setup.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw "no installer found in release/" }
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Desk\Desk.exe'
          if (-not (Test-Path $exe)) { throw "installed exe not found: $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList '--disable-gpu','--smoke' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "smoke failed with exit code $($proc.ExitCode)" }
      - name: Smoke test the installed app
        if: matrix.platform == 'macos'
        timeout-minutes: 10
        run: |
          set -e
          mkdir -p /tmp/desk-smoke
          dmg=$(ls release/*.dmg | head -1)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /tmp/desk-smoke
          /tmp/desk-smoke/Desk.app/Contents/MacOS/Desk --disable-gpu --smoke
          hdiutil detach /tmp/desk-smoke
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download native installers
        uses: actions/download-artifact@v8
        with:
          pattern: desk-*
          path: release-artifacts
          merge-multiple: true
      - name: Write SHA-256 checksums
        run: node scripts/write-checksums.cjs release-artifacts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          test -n "$(ls -A release-artifacts)" || { echo "no artifacts to release"; exit 1; }
          extra=""
          case "${GITHUB_REF_NAME}" in *-*) extra="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* --repo "${GITHUB_REPOSITORY}" --title "Desk ${GITHUB_REF_NAME}" --generate-notes ${extra}
