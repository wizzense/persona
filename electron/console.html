<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- frame-src is the whole point of this window: the panes ARE frames. file: covers
     command.html / fleet-control.html / the production renderer bundle; the two
     loopback origins cover VITE_DEV_SERVER_URL. Nothing else may be framed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src 'unsafe-inline'; img-src data:; frame-src file: http://localhost:* http://127.0.0.1:*;" />
<title>Aither Console</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  /* Colours, type and scrollbars come from aither-tokens.css -- GENERATED from Veil's
     tokens by AitherOS/dev/tools/gen_desk_tokens.py. This pane used to re-declare its
     own --bg/--panel/--line/--fg palette by hand; five panes did, none matched the
     family. What stays here is only what this pane MEANS by a colour. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 var(--font-sans); }
  body { display: grid; grid-template-columns: 216px 1fr; height: 100vh; }

  /* The rail. Same grammar as the workspace sidebar and the Living Desktop's
     launcher: a mark, SECTIONS with quiet caps headings, an icon per row, the
     selected row marked by the theme's signature colour. It used to be eight
     stacked two-line text blocks and a sentence of instructions. */
  nav { background: var(--bg-deep); border-right: 1px solid var(--line); display: flex;
    flex-direction: column; padding: 0 8px 8px; gap: 1px; min-height: 0; }
  /* Windows draws the caption buttons over this window (titleBarOverlay), so the
     top strip of both columns IS the title bar: draggable, and clear of the buttons. */
  .brand { -webkit-app-region: drag; display: flex; align-items: center; gap: 9px;
    height: 46px; padding: 0 8px; flex: none; }
  .brand svg { width: 18px; height: 18px; color: var(--brand); flex: none; }
  .brand b { font-size: 13px; font-weight: 650; letter-spacing: .01em; }
  .brand span { font-size: 13px; color: var(--muted); }
  #rail { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 1px; }
  .section { font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--surface-500); padding: 12px 10px 5px; }
  .tab { appearance: none; text-align: left; border: 0; background: none; color: var(--surface-300);
    border-radius: var(--radius); padding: 7px 10px; cursor: pointer; display: grid;
    grid-template-columns: 18px 1fr auto; align-items: center; column-gap: 10px;
    position: relative; font: inherit; transition: background .12s, color .12s; }
  .tab svg { width: 16px; height: 16px; color: var(--surface-400); transition: color .12s; }
  .tab:hover { background: var(--surface-900); color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--surface-800); color: var(--fg); }
  .tab[aria-selected="true"] svg { color: var(--brand); }
  .tab[aria-selected="true"]::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }
  .tab .name { font-size: 13px; font-weight: 550; }
  /* The hint is the row's tooltip now; the shell bar shows it for the pane you are on. */
  .tab .hint { display: none; }
  .tab .badge { font-size: 10px; font-weight: 650; letter-spacing: .02em; color: var(--muted); }
  .tab .badge.count { color: var(--background); background: var(--warn); border-radius: 999px;
    padding: 1px 7px; min-width: 18px; text-align: center; }
  nav .spacer { flex: 1; }
  /* The footer answers "is any of this connected?" and "make it look like mine" --
     the two things a status bar is for. */
  .foot { border-top: 1px solid var(--line); margin: 6px -8px 0; padding: 9px 12px 2px;
    display: grid; gap: 8px; font-size: 11px; color: var(--muted); }
  .foot .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .foot kbd { font: 10px var(--font-mono); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; color: var(--surface-300); background: var(--surface-900); }
  .foot button.link { appearance: none; border: 0; background: none; color: var(--surface-300);
    font: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 6px; align-items: center; }
  .foot button.link:hover { color: var(--fg); }
  .foot select { appearance: none; background: var(--surface-900); color: var(--surface-200);
    border: 1px solid var(--line); border-radius: 6px; font: 11px var(--font-sans);
    padding: 3px 8px; max-width: 124px; cursor: pointer; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); flex: none; }

  main { display: flex; flex-direction: column; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 10px; height: 46px; flex: none;
    padding: 0 14px; border-bottom: 1px solid var(--line); -webkit-app-region: drag;
    /* keep clear of the OS caption buttons drawn over this strip */
    padding-right: calc(100vw - env(titlebar-area-width, 100vw) + 14px); }
  .bar button, .bar .chip { -webkit-app-region: no-drag; }
  .bar .title { font-size: 13px; font-weight: 600; }
  .bar .state { font-size: 11px; color: var(--muted); }
  .bar .grow { flex: 1; }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--muted);
    border-radius: 6px; padding: 6px 11px; font: 12px/1.2 var(--font-sans); cursor: pointer;
    transition: background .12s, color .12s; }
  .chip:hover { background: var(--btn-hi); color: var(--fg); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }

  .stage { position: relative; flex: 1; min-height: 0; background: var(--bg-sunk); }
  .pane { position: absolute; inset: 0; border: 0; width: 100%; height: 100%; display: none; }
  .pane.active { display: block; }
  .pane.hosted { background: var(--bg-sunk); }
  .placeholder { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; text-align: center; padding: 40px; color: var(--muted); }
  .placeholder.active { display: flex; }
  .placeholder div { max-width: 380px; }
  .placeholder strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 8px; }
  .placeholder p { margin: 0 0 16px; font-size: 12px; line-height: 1.6; }
  #error { color: var(--bad); font-size: 11px; padding: 0 14px 8px; min-height: 0; }

  /* The palette: one keystroke to everything, because a capability that lives
     only in a menu is one gesture change away from being unreachable. */
  .scrim { position: fixed; inset: 0; background: rgba(6, 8, 12, .55); display: none;
    align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 50; }
  .scrim.open { display: flex; }
  .palette { width: min(560px, 90vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); overflow: hidden; }
  .palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--bg-deep);
    color: var(--fg); font: 14px/1.4 var(--font-sans); padding: 13px 15px; outline: none; }
  .palette ul { list-style: none; margin: 0; padding: 6px; max-height: 46vh; overflow-y: auto; }
  .palette li { padding: 9px 11px; border-radius: 7px; cursor: pointer; display: flex;
    justify-content: space-between; gap: 12px; font-size: 13px; }
  .palette li .where { color: var(--muted); font-size: 11px; }
  .palette li[aria-selected="true"] { background: var(--btn-hi); }
  .palette .empty { padding: 14px 15px; color: var(--muted); font-size: 12px; }
  .palette .hint { border-top: 1px solid var(--line); padding: 8px 15px; color: var(--muted);
    font-size: 11px; }
</style>
</head>
<body>
  <nav>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 20.2 7.25v9.5L12 21.5 3.8 16.75v-9.5z"/></svg>
      <b>Aither</b><span>Console</span>
    </div>
    <div id="rail" role="tablist" aria-orientation="vertical"></div>
    <div class="spacer"></div>
    <div class="foot">
      <div class="row">
        <button class="link" id="open-palette" title="Everything Desk can do">Commands</button>
        <kbd>Ctrl K</kbd>
      </div>
      <div class="row">
        <span style="display:inline-flex;gap:7px;align-items:center"><span class="swatch"></span>Theme</span>
        <select id="theme" aria-label="Theme" title="The same eleven themes as awsh and aitherium.com"></select>
      </div>
    </div>
  </nav>

  <main>
    <div class="bar">
      <span class="title" id="bar-title">—</span>
      <span class="state" id="bar-state"></span>
      <span class="grow"></span>
      <button class="chip" id="btn-detach">Detach</button>
      <button class="chip" id="btn-reattach" hidden>Reattach</button>
      <button class="chip" id="btn-close" hidden>Close</button>
    </div>
    <div id="error"></div>
    <div class="stage" id="stage"></div>
  </main>

  <div class="scrim" id="scrim">
    <div class="palette" role="dialog" aria-label="Command palette">
      <input id="palette-input" type="text" placeholder="Type a command — size, inbox, console…"
             autocomplete="off" spellcheck="false" />
      <ul id="palette-list"></ul>
      <div class="hint">Enter runs · Esc closes · Ctrl+K opens</div>
    </div>
  </div>

<script>
"use strict";

// The console shell. It owns exactly three things: which pane is selected, whether
// a pane is embedded or detached, and the lazy creation of a pane's iframe. Every
// other decision (where a pane's content lives, which window a detach opens) is
// main's, reached through window.aitherConsole -- so the shell cannot hold a second,
// diverging idea of what a pane is.

const rail = document.getElementById("rail");
const stage = document.getElementById("stage");
const barTitle = document.getElementById("bar-title");
const barState = document.getElementById("bar-state");
const btnDetach = document.getElementById("btn-detach");
const btnReattach = document.getElementById("btn-reattach");
const errorLine = document.getElementById("error");

let panes = [];
let selected = null;
let detached = new Set();

function say(message) {
  errorLine.textContent = message || "";
}

/** Lazily build a pane's iframe. Called on first show, never at startup: the Fleet
 *  pane probes seven doors on load and the Cards pane boots the renderer bundle. */
function frameFor(pane) {
  let frame = document.getElementById("pane-" + pane.id);
  if (frame) return frame;
  if (pane.hosted) {
    // Main paints this one itself (its own session partition). The shell keeps an
    // empty rectangle so the layout is identical and reports where it landed.
    frame = document.createElement("div");
    frame.id = "pane-" + pane.id;
    frame.className = "pane hosted";
    stage.appendChild(frame);
    return frame;
  }
  if (!pane.src) {
    // Main refused to resolve this pane (empty renderer base). Say so; never load
    // a relative "?deck=1", which would nest the console inside itself.
    frame = document.createElement("div");
    frame.id = "pane-" + pane.id;
    frame.className = "placeholder";
    const inner = document.createElement("div");
    const head = document.createElement("strong");
    head.textContent = pane.label + " has nowhere to load from";
    const body = document.createElement("p");
    body.textContent = pane.unavailable || "the renderer bundle did not resolve";
    inner.append(head, body);
    frame.appendChild(inner);
    stage.appendChild(frame);
    return frame;
  }
  frame = document.createElement("iframe");
  frame.id = "pane-" + pane.id;
  frame.className = "pane";
  frame.setAttribute("title", pane.label);
  frame.src = pane.src;
  stage.appendChild(frame);
  return frame;
}

function placeholderFor(pane) {
  let node = document.getElementById("ph-" + pane.id);
  if (node) return node;
  node = document.createElement("div");
  node.id = "ph-" + pane.id;
  node.className = "placeholder";
  const inner = document.createElement("div");
  const head = document.createElement("strong");
  head.textContent = pane.label + " is in its own window";
  const body = document.createElement("p");
  body.textContent = "It is still running -- just not here. Reattach closes that "
    + "window and brings the pane back into the console.";
  const button = document.createElement("button");
  button.className = "chip";
  button.textContent = "Reattach " + pane.label;
  button.addEventListener("click", () => reattach(pane.id));
  inner.append(head, body, button);
  node.appendChild(inner);
  stage.appendChild(node);
  return node;
}

// The inbox count rides the Inbox tab, pushed by main whenever it changes.
let inboxCount = 0;
if (window.aitherConsole && typeof window.aitherConsole.onInboxCount === "function") {
  window.aitherConsole.onInboxCount((count) => {
    inboxCount = count;
    render();
  });
}

function render() {
  for (const pane of panes) {
    const isSelected = pane.id === selected;
    const isDetached = detached.has(pane.id);

    const tab = document.getElementById("tab-" + pane.id);
    if (tab) {
      tab.setAttribute("aria-selected", String(isSelected));
      const badge = tab.querySelector(".badge");
      const count = pane.id === "cards" && inboxCount > 0 && !isDetached;
      badge.textContent = isDetached ? "detached" : (count ? String(inboxCount) : "");
      badge.classList.toggle("count", count);
    }

    // A DETACHED pane's iframe is destroyed, not merely hidden. Two live copies of
    // the Fleet pane would both poll the fleet and both claim to be the truth.
    const existing = document.getElementById("pane-" + pane.id);
    if (isDetached && existing) existing.remove();

    // ...and symmetrically, a REATTACHED pane's placeholder is destroyed. The
    // placeholder is absolutely positioned over the whole stage, so leaving it
    // .active paints "Inbox is in its own window" ON TOP of the pane that just
    // came back -- a reattach that changed everything except what is on screen.
    const stale = document.getElementById("ph-" + pane.id);
    if (!isDetached && stale) stale.remove();

    if (isSelected) {
      const node = isDetached ? placeholderFor(pane) : frameFor(pane);
      node.classList.add("active");
      barTitle.textContent = pane.label;
      barState.textContent = isDetached ? "detached" : pane.hint;
      btnDetach.hidden = isDetached;
      btnReattach.hidden = !isDetached;
    } else {
      const node = document.getElementById("pane-" + pane.id);
      if (node) node.classList.remove("active");
      const ph = document.getElementById("ph-" + pane.id);
      if (ph) ph.classList.remove("active");
    }
  }
}

/** Tell main where each HOSTED pane should be, or that it is hidden. One message
 *  per hosted pane every time, so a view can never be left painted over another. */
function reportStage() {
  for (const pane of panes) {
    if (!pane.hosted) continue;
    const showing = pane.id === selected && !detached.has(pane.id);
    if (!showing) { void window.aitherConsole.stage(pane.id, null); continue; }
    const r = stage.getBoundingClientRect();
    void window.aitherConsole.stage(pane.id, {
      x: r.left, y: r.top, width: r.width, height: r.height,
    });
  }
}

function select(paneId) {
  selected = paneId;
  say("");
  render();
  reportStage();
}

async function refreshDetached() {
  try {
    const ids = await window.aitherConsole.detached();
    detached = new Set(Array.isArray(ids) ? ids : []);
  } catch (error) {
    say(String(error && error.message ? error.message : error));
  }
  render();
  reportStage();
}

async function detach(paneId) {
  const result = await window.aitherConsole.detach(paneId);
  if (!result || result.ok !== true) {
    say((result && result.error) || "could not detach " + paneId);
  }
  detached = new Set((result && result.detached) || []);
  render();
  reportStage();
}

async function reattach(paneId) {
  const result = await window.aitherConsole.reattach(paneId);
  if (!result || result.ok !== true) {
    say((result && result.error) || "could not reattach " + paneId);
  }
  detached = new Set((result && result.detached) || []);
  render();
  reportStage();
}

btnDetach.addEventListener("click", () => selected && detach(selected));
btnReattach.addEventListener("click", () => selected && reattach(selected));
document.getElementById("btn-close").addEventListener("click", () => window.aitherConsole.close());

// WHERE each pane is has ONE owner in main (surface-state.cjs); the shell renders
// the map it is handed rather than keeping a second copy. This arrives whenever
// the map moves -- including when the owner closes a detached window from its own
// title bar, which the rail used to miss until the console next regained focus.
if (typeof window.aitherConsole.onSurfaces === "function") {
  window.aitherConsole.onSurfaces((snapshot) => {
    const next = new Set(Object.entries(snapshot)
      .filter(([, presentation]) => presentation === "detached")
      .map(([paneId]) => paneId));
    const same = next.size === detached.size && [...next].every((id) => detached.has(id));
    if (same) return;
    detached = next;
    render();
    reportStage();
  });
}
// Backstop for a push that never arrived (a reload mid-transition): re-derive on
// focus. Cheap, and it cannot contradict main -- it asks main.
window.addEventListener("focus", () => { void refreshDetached(); });
// A hosted view is positioned in DEVICE pixels by main and knows nothing about
// the window changing size -- without this it stays the old size over the new
// layout, which looks like a frozen pane rather than a missing message.
window.addEventListener("resize", () => { reportStage(); });

// Main routing a surface here -- today a decision card, which used to spawn its
// own Tk popup. `param` names one card; the pane is reloaded with it so "show me
// THIS card" lands somewhere specific instead of merely opening the deck.
// ── The command palette ───────────────────────────────────────────────────────
// Ctrl+K anywhere in the console. Rows come from main's command registry, which
// is also what renders the tray and the avatar menu -- so the palette cannot
// offer a stale set, and a capability can never again be reachable through one
// gesture only. The shell holds no command of its own; it renders and calls back.
const scrim = document.getElementById("scrim");
const paletteInput = document.getElementById("palette-input");
const paletteList = document.getElementById("palette-list");
let paletteRows = [];
let paletteCursor = 0;
// A row that declared `prompt` needs ONE typed argument (a title, a slug). The
// palette stays open, the input becomes that field, Enter runs, Esc backs out.
// Nothing else changes: rows without `prompt` run on Enter as before.
let pendingPrompt = null; // the row awaiting its argument
const PALETTE_PLACEHOLDER = paletteInput.placeholder;

function paletteMatches() {
  if (pendingPrompt) return [];
  const needle = paletteInput.value.trim().toLowerCase();
  if (!needle) return paletteRows;
  // Every word must appear somewhere in the label or the id: "win la" finds
  // "Large" under window-size without anyone learning the id.
  const words = needle.split(/\s+/);
  return paletteRows.filter((row) => {
    const hay = `${row.label} ${row.id} ${row.group}`.toLowerCase();
    return words.every((word) => hay.includes(word));
  });
}

function renderPalette() {
  const rows = paletteMatches();
  if (paletteCursor >= rows.length) paletteCursor = Math.max(0, rows.length - 1);
  paletteList.replaceChildren();
  if (pendingPrompt) {
    const hint = document.createElement("div");
    hint.className = "empty";
    hint.textContent = `${pendingPrompt.label} — Enter to run, Esc to go back`;
    paletteList.appendChild(hint);
    return;
  }
  if (!rows.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = paletteRows.length
      ? "Nothing matches that."
      : "No commands came back — main did not wire the registry.";
    paletteList.appendChild(empty);
    return;
  }
  rows.forEach((row, index) => {
    const item = document.createElement("li");
    item.setAttribute("aria-selected", String(index === paletteCursor));
    const label = document.createElement("span");
    label.textContent = row.label;
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = row.group;
    item.append(label, where);
    item.addEventListener("click", () => choosePalette(row));
    paletteList.appendChild(item);
  });
}

/** Enter/click on a row: run it, or -- when it declared `prompt` -- ask first. */
function choosePalette(row) {
  if (row.prompt) return askPalette(row);
  return runPalette(row.id);
}

function askPalette(row) {
  pendingPrompt = row;
  paletteInput.value = "";
  paletteInput.placeholder = row.prompt.placeholder || row.label;
  renderPalette();
  paletteInput.focus();
}

function unaskPalette() {
  pendingPrompt = null;
  paletteInput.value = "";
  paletteInput.placeholder = PALETTE_PLACEHOLDER;
  renderPalette();
}

async function runPalette(id, arg) {
  closePalette();
  const result = await window.aitherConsole.runCommand(id, arg);
  // A command that could not run says so where the owner is looking, rather than
  // leaving a palette that appears to have done something. One that answered
  // with a message (the blog verbs) shows it on the same line.
  if (!result || result.ok !== true) say((result && (result.error || result.message)) || `could not run ${id}`);
  else if (result.message) say(result.message);
}

async function openPalette() {
  try {
    paletteRows = (await window.aitherConsole.commands()) || [];
  } catch (error) {
    paletteRows = [];
    say(String((error && error.message) || error));
  }
  paletteCursor = 0;
  paletteInput.value = "";
  scrim.classList.add("open");
  renderPalette();
  paletteInput.focus();
}

function closePalette() {
  scrim.classList.remove("open");
  paletteInput.blur();
  pendingPrompt = null;
  paletteInput.placeholder = PALETTE_PLACEHOLDER;
}

paletteInput.addEventListener("input", () => { paletteCursor = 0; renderPalette(); });
scrim.addEventListener("mousedown", (event) => { if (event.target === scrim) closePalette(); });
document.addEventListener("keydown", (event) => {
  const open = scrim.classList.contains("open");
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    return void (open ? closePalette() : openPalette());
  }
  if (!open) return;
  if (event.key === "Escape") {
    event.preventDefault();
    return pendingPrompt ? unaskPalette() : closePalette();
  }
  if (pendingPrompt) {
    if (event.key !== "Enter") return;
    event.preventDefault();
    const arg = paletteInput.value.trim();
    if (!arg) return; // an empty title/slug is not a command
    const row = pendingPrompt;
    return void runPalette(row.id, arg);
  }
  const rows = paletteMatches();
  if (event.key === "ArrowDown") {
    event.preventDefault();
    paletteCursor = rows.length ? (paletteCursor + 1) % rows.length : 0;
    return renderPalette();
  }
  if (event.key === "ArrowUp") {
    event.preventDefault();
    paletteCursor = rows.length ? (paletteCursor - 1 + rows.length) % rows.length : 0;
    return renderPalette();
  }
  if (event.key === "Enter" && rows[paletteCursor]) {
    event.preventDefault();
    return void choosePalette(rows[paletteCursor]);
  }
});

// 🚩 A pane asked for while the console is still COLD-OPENING used to land on Inbox.
// "Chat with <agent>…" on a body's menu, "Cast & voices…" on the tray, a decision
// card arriving: each opens the console and names a pane in the same breath. The
// request reached this page before start() had loaded `panes` (so find() dropped
// it), or just after -- and then start() selected panes[0] over it. Either way the
// owner clicked Chat and got Inbox. A request that arrives early is HELD, and
// start() honours it instead of choosing for him.
let pendingFocus = null;
let started = false;

function applyFocus(payload) {
  if (!payload || !payload.pane) return false;
  const pane = panes.find((p) => p.id === payload.pane);
  if (!pane) return false;
  if (payload.param && pane.src) {
    const want = pane.src + (pane.src.includes("?") ? "&" : "?")
      + "card=" + encodeURIComponent(payload.param);
    const frame = document.getElementById("pane-" + pane.id);
    if (frame && frame.tagName === "IFRAME" && frame.src !== want) frame.src = want;
    else if (!frame) pane.src = want;
  }
  select(pane.id);
  return true;
}

window.aitherConsole.onFocus((payload) => {
  if (!started) { pendingFocus = payload; return; }
  applyFocus(payload);
});

// Icon NAME (pane data from main) -> drawing. Same stroke set as the avatar's bead
// rail and the workspace sidebar, so the three read as one hand.
const ICON_PATHS = {
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  terminal: '<path d="m5 8 4 4-4 4"/><path d="M12 16h7"/>',
  server: '<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  chat: '<path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M21 20a6 6 0 0 0-3.5-5.4"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  desktop: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
};
function iconSvg(name) {
  const paths = ICON_PATHS[name] || ICON_PATHS.grid;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
    + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + "</svg>";
}

// The theme picker: the family's eleven, read from main (generated from Veil's
// themes.ts). Choosing one writes cast.json and re-skins every pane at once.
(async function themes() {
  const select = document.getElementById("theme");
  if (!window.aitherConsole || typeof window.aitherConsole.appearance !== "function") return;
  try {
    const now = await window.aitherConsole.appearance();
    for (const theme of now.themes || []) {
      const option = document.createElement("option");
      option.value = theme.id;
      option.textContent = theme.name;
      select.appendChild(option);
    }
    select.value = now.theme;
  } catch (error) {
    say("could not load themes: " + String(error && error.message ? error.message : error));
  }
  select.addEventListener("change", async () => {
    const result = await window.aitherConsole.setAppearance({ theme: select.value });
    if (!result || result.ok !== true) say((result && result.error) || "could not set the theme");
  });
})();

document.getElementById("open-palette").addEventListener("click", () => { void openPalette(); });

(async function start() {
  try {
    panes = await window.aitherConsole.panes();
  } catch (error) {
    say("could not load panes: " + String(error && error.message ? error.message : error));
    return;
  }
  let section = null;
  for (const pane of panes) {
    if (pane.section && pane.section !== section) {
      section = pane.section;
      const heading = document.createElement("div");
      heading.className = "section";
      heading.textContent = section;
      rail.appendChild(heading);
    }
    const tab = document.createElement("button");
    tab.className = "tab";
    tab.id = "tab-" + pane.id;
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", "false");
    tab.title = pane.hint || pane.label;
    tab.insertAdjacentHTML("afterbegin", iconSvg(pane.icon));
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = pane.label;
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = pane.hint;
    const badge = document.createElement("span");
    badge.className = "badge";
    tab.append(name, hint, badge);
    tab.addEventListener("click", () => select(pane.id));
    rail.appendChild(tab);
  }
  await refreshDetached();
  started = true;
  // The pane somebody ASKED for wins over the default first pane.
  if (!applyFocus(pendingFocus) && panes.length) select(panes[0].id);
  pendingFocus = null;
})();
</script>
