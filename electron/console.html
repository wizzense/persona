<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- frame-src is the whole point of this window: the panes ARE frames. file: covers
     command.html / fleet-control.html / the production renderer bundle; the two
     loopback origins cover VITE_DEV_SERVER_URL. Nothing else may be framed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; frame-src file: http://localhost:* http://127.0.0.1:*;" />
<title>Aither Console</title>
<style>
  :root {
    --bg: #0f1218; --panel: #171b24; --line: #262c3a; --fg: #e6e9f0; --muted: #8a93a6;
    --btn: #222838; --btn-hi: #2c3447; --accent: #9ec1ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: 190px 1fr; height: 100vh; }

  nav { background: #0b0e14; border-right: 1px solid var(--line); display: flex;
    flex-direction: column; padding: 12px 10px; gap: 4px; }
  nav h1 { font-size: 13px; margin: 2px 8px 10px; font-weight: 600; letter-spacing: .06em;
    color: var(--muted); text-transform: uppercase; }
  .tab { appearance: none; text-align: left; border: 1px solid transparent; background: none;
    color: var(--fg); border-radius: 8px; padding: 9px 10px; cursor: pointer; display: grid; gap: 2px;
    transition: background .12s, border-color .12s; }
  .tab:hover { background: var(--btn); }
  .tab[aria-selected="true"] { background: var(--panel); border-color: var(--line); }
  .tab .name { font-size: 13px; font-weight: 600; }
  .tab .hint { font-size: 11px; color: var(--muted); }
  .tab .badge { font-size: 10px; color: #f5a524; letter-spacing: .04em; }
  nav .spacer { flex: 1; }
  nav .foot { color: var(--muted); font-size: 11px; padding: 6px 8px; }

  main { display: flex; flex-direction: column; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); }
  .bar .title { font-size: 13px; font-weight: 600; }
  .bar .state { font-size: 11px; color: var(--muted); }
  .bar .grow { flex: 1; }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--muted);
    border-radius: 6px; padding: 6px 11px; font: 12px/1.2 system-ui; cursor: pointer;
    transition: background .12s, color .12s; }
  .chip:hover { background: var(--btn-hi); color: var(--fg); }
  .chip:disabled { opacity: .45; cursor: not-allowed; }

  .stage { position: relative; flex: 1; min-height: 0; background: #0a0c11; }
  .pane { position: absolute; inset: 0; border: 0; width: 100%; height: 100%; display: none; }
  .pane.active { display: block; }
  .pane.hosted { background: #0a0c11; }
  .placeholder { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; text-align: center; padding: 40px; color: var(--muted); }
  .placeholder.active { display: flex; }
  .placeholder div { max-width: 380px; }
  .placeholder strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 8px; }
  .placeholder p { margin: 0 0 16px; font-size: 12px; line-height: 1.6; }
  #error { color: #ff8b8f; font-size: 11px; padding: 0 14px 8px; min-height: 0; }

  /* The palette: one keystroke to everything, because a capability that lives
     only in a menu is one gesture change away from being unreachable. */
  .scrim { position: fixed; inset: 0; background: rgba(6, 8, 12, .55); display: none;
    align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 50; }
  .scrim.open { display: flex; }
  .palette { width: min(560px, 90vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); overflow: hidden; }
  .palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: #10141d;
    color: var(--fg); font: 14px/1.4 system-ui; padding: 13px 15px; outline: none; }
  .palette ul { list-style: none; margin: 0; padding: 6px; max-height: 46vh; overflow-y: auto; }
  .palette li { padding: 9px 11px; border-radius: 7px; cursor: pointer; display: flex;
    justify-content: space-between; gap: 12px; font-size: 13px; }
  .palette li .where { color: var(--muted); font-size: 11px; }
  .palette li[aria-selected="true"] { background: var(--btn-hi); }
  .palette .empty { padding: 14px 15px; color: var(--muted); font-size: 12px; }
  .palette .hint { border-top: 1px solid var(--line); padding: 8px 15px; color: var(--muted);
    font-size: 11px; }
</style>
</head>
<body>
  <nav>
    <h1>Aither</h1>
    <div id="rail"></div>
    <div class="spacer"></div>
    <div class="foot">One window. Detach any pane; take it back the same way.</div>
  </nav>

  <main>
    <div class="bar">
      <span class="title" id="bar-title">—</span>
      <span class="state" id="bar-state"></span>
      <span class="grow"></span>
      <button class="chip" id="btn-detach">Detach</button>
      <button class="chip" id="btn-reattach" hidden>Reattach</button>
      <button class="chip" id="btn-close">Close</button>
    </div>
    <div id="error"></div>
    <div class="stage" id="stage"></div>
  </main>

  <div class="scrim" id="scrim">
    <div class="palette" role="dialog" aria-label="Command palette">
      <input id="palette-input" type="text" placeholder="Type a command — size, inbox, console…"
             autocomplete="off" spellcheck="false" />
      <ul id="palette-list"></ul>
      <div class="hint">Enter runs · Esc closes · Ctrl+K opens</div>
    </div>
  </div>

<script>
"use strict";

// The console shell. It owns exactly three things: which pane is selected, whether
// a pane is embedded or detached, and the lazy creation of a pane's iframe. Every
// other decision (where a pane's content lives, which window a detach opens) is
// main's, reached through window.aitherConsole -- so the shell cannot hold a second,
// diverging idea of what a pane is.

const rail = document.getElementById("rail");
const stage = document.getElementById("stage");
const barTitle = document.getElementById("bar-title");
const barState = document.getElementById("bar-state");
const btnDetach = document.getElementById("btn-detach");
const btnReattach = document.getElementById("btn-reattach");
const errorLine = document.getElementById("error");

let panes = [];
let selected = null;
let detached = new Set();

function say(message) {
  errorLine.textContent = message || "";
}

/** Lazily build a pane's iframe. Called on first show, never at startup: the Fleet
 *  pane probes seven doors on load and the Cards pane boots the renderer bundle. */
function frameFor(pane) {
  let frame = document.getElementById("pane-" + pane.id);
  if (frame) return frame;
  if (pane.hosted) {
    // Main paints this one itself (its own session partition). The shell keeps an
    // empty rectangle so the layout is identical and reports where it landed.
    frame = document.createElement("div");
    frame.id = "pane-" + pane.id;
    frame.className = "pane hosted";
    stage.appendChild(frame);
    return frame;
  }
  if (!pane.src) {
    // Main refused to resolve this pane (empty renderer base). Say so; never load
    // a relative "?deck=1", which would nest the console inside itself.
    frame = document.createElement("div");
    frame.id = "pane-" + pane.id;
    frame.className = "placeholder";
    const inner = document.createElement("div");
    const head = document.createElement("strong");
    head.textContent = pane.label + " has nowhere to load from";
    const body = document.createElement("p");
    body.textContent = pane.unavailable || "the renderer bundle did not resolve";
    inner.append(head, body);
    frame.appendChild(inner);
    stage.appendChild(frame);
    return frame;
  }
  frame = document.createElement("iframe");
  frame.id = "pane-" + pane.id;
  frame.className = "pane";
  frame.setAttribute("title", pane.label);
  frame.src = pane.src;
  stage.appendChild(frame);
  return frame;
}

function placeholderFor(pane) {
  let node = document.getElementById("ph-" + pane.id);
  if (node) return node;
  node = document.createElement("div");
  node.id = "ph-" + pane.id;
  node.className = "placeholder";
  const inner = document.createElement("div");
  const head = document.createElement("strong");
  head.textContent = pane.label + " is in its own window";
  const body = document.createElement("p");
  body.textContent = "It is still running -- just not here. Reattach closes that "
    + "window and brings the pane back into the console.";
  const button = document.createElement("button");
  button.className = "chip";
  button.textContent = "Reattach " + pane.label;
  button.addEventListener("click", () => reattach(pane.id));
  inner.append(head, body, button);
  node.appendChild(inner);
  stage.appendChild(node);
  return node;
}

// The inbox count rides the Inbox tab, pushed by main whenever it changes.
let inboxCount = 0;
if (window.aitherConsole && typeof window.aitherConsole.onInboxCount === "function") {
  window.aitherConsole.onInboxCount((count) => {
    inboxCount = count;
    render();
  });
}

function render() {
  for (const pane of panes) {
    const isSelected = pane.id === selected;
    const isDetached = detached.has(pane.id);

    const tab = document.getElementById("tab-" + pane.id);
    if (tab) {
      tab.setAttribute("aria-selected", String(isSelected));
      tab.querySelector(".badge").textContent = isDetached
        ? "detached"
        : (pane.id === "cards" && inboxCount > 0 ? String(inboxCount) : "");
    }

    // A DETACHED pane's iframe is destroyed, not merely hidden. Two live copies of
    // the Fleet pane would both poll the fleet and both claim to be the truth.
    const existing = document.getElementById("pane-" + pane.id);
    if (isDetached && existing) existing.remove();

    // ...and symmetrically, a REATTACHED pane's placeholder is destroyed. The
    // placeholder is absolutely positioned over the whole stage, so leaving it
    // .active paints "Inbox is in its own window" ON TOP of the pane that just
    // came back -- a reattach that changed everything except what is on screen.
    const stale = document.getElementById("ph-" + pane.id);
    if (!isDetached && stale) stale.remove();

    if (isSelected) {
      const node = isDetached ? placeholderFor(pane) : frameFor(pane);
      node.classList.add("active");
      barTitle.textContent = pane.label;
      barState.textContent = isDetached ? "detached" : pane.hint;
      btnDetach.hidden = isDetached;
      btnReattach.hidden = !isDetached;
    } else {
      const node = document.getElementById("pane-" + pane.id);
      if (node) node.classList.remove("active");
      const ph = document.getElementById("ph-" + pane.id);
      if (ph) ph.classList.remove("active");
    }
  }
}

/** Tell main where each HOSTED pane should be, or that it is hidden. One message
 *  per hosted pane every time, so a view can never be left painted over another. */
function reportStage() {
  for (const pane of panes) {
    if (!pane.hosted) continue;
    const showing = pane.id === selected && !detached.has(pane.id);
    if (!showing) { void window.aitherConsole.stage(pane.id, null); continue; }
    const r = stage.getBoundingClientRect();
    void window.aitherConsole.stage(pane.id, {
      x: r.left, y: r.top, width: r.width, height: r.height,
    });
  }
}

function select(paneId) {
  selected = paneId;
  say("");
  render();
  reportStage();
}

async function refreshDetached() {
  try {
    const ids = await window.aitherConsole.detached();
    detached = new Set(Array.isArray(ids) ? ids : []);
  } catch (error) {
    say(String(error && error.message ? error.message : error));
  }
  render();
  reportStage();
}

async function detach(paneId) {
  const result = await window.aitherConsole.detach(paneId);
  if (!result || result.ok !== true) {
    say((result && result.error) || "could not detach " + paneId);
  }
  detached = new Set((result && result.detached) || []);
  render();
  reportStage();
}

async function reattach(paneId) {
  const result = await window.aitherConsole.reattach(paneId);
  if (!result || result.ok !== true) {
    say((result && result.error) || "could not reattach " + paneId);
  }
  detached = new Set((result && result.detached) || []);
  render();
  reportStage();
}

btnDetach.addEventListener("click", () => selected && detach(selected));
btnReattach.addEventListener("click", () => selected && reattach(selected));
document.getElementById("btn-close").addEventListener("click", () => window.aitherConsole.close());

// WHERE each pane is has ONE owner in main (surface-state.cjs); the shell renders
// the map it is handed rather than keeping a second copy. This arrives whenever
// the map moves -- including when the owner closes a detached window from its own
// title bar, which the rail used to miss until the console next regained focus.
if (typeof window.aitherConsole.onSurfaces === "function") {
  window.aitherConsole.onSurfaces((snapshot) => {
    const next = new Set(Object.entries(snapshot)
      .filter(([, presentation]) => presentation === "detached")
      .map(([paneId]) => paneId));
    const same = next.size === detached.size && [...next].every((id) => detached.has(id));
    if (same) return;
    detached = next;
    render();
    reportStage();
  });
}
// Backstop for a push that never arrived (a reload mid-transition): re-derive on
// focus. Cheap, and it cannot contradict main -- it asks main.
window.addEventListener("focus", () => { void refreshDetached(); });
// A hosted view is positioned in DEVICE pixels by main and knows nothing about
// the window changing size -- without this it stays the old size over the new
// layout, which looks like a frozen pane rather than a missing message.
window.addEventListener("resize", () => { reportStage(); });

// Main routing a surface here -- today a decision card, which used to spawn its
// own Tk popup. `param` names one card; the pane is reloaded with it so "show me
// THIS card" lands somewhere specific instead of merely opening the deck.
// ── The command palette ───────────────────────────────────────────────────────
// Ctrl+K anywhere in the console. Rows come from main's command registry, which
// is also what renders the tray and the avatar menu -- so the palette cannot
// offer a stale set, and a capability can never again be reachable through one
// gesture only. The shell holds no command of its own; it renders and calls back.
const scrim = document.getElementById("scrim");
const paletteInput = document.getElementById("palette-input");
const paletteList = document.getElementById("palette-list");
let paletteRows = [];
let paletteCursor = 0;

function paletteMatches() {
  const needle = paletteInput.value.trim().toLowerCase();
  if (!needle) return paletteRows;
  // Every word must appear somewhere in the label or the id: "win la" finds
  // "Large" under window-size without anyone learning the id.
  const words = needle.split(/\s+/);
  return paletteRows.filter((row) => {
    const hay = `${row.label} ${row.id} ${row.group}`.toLowerCase();
    return words.every((word) => hay.includes(word));
  });
}

function renderPalette() {
  const rows = paletteMatches();
  if (paletteCursor >= rows.length) paletteCursor = Math.max(0, rows.length - 1);
  paletteList.replaceChildren();
  if (!rows.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = paletteRows.length
      ? "Nothing matches that."
      : "No commands came back — main did not wire the registry.";
    paletteList.appendChild(empty);
    return;
  }
  rows.forEach((row, index) => {
    const item = document.createElement("li");
    item.setAttribute("aria-selected", String(index === paletteCursor));
    const label = document.createElement("span");
    label.textContent = row.label;
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = row.group;
    item.append(label, where);
    item.addEventListener("click", () => runPalette(row.id));
    paletteList.appendChild(item);
  });
}

async function runPalette(id) {
  closePalette();
  const result = await window.aitherConsole.runCommand(id);
  // A command that could not run says so where the owner is looking, rather than
  // leaving a palette that appears to have done something.
  if (!result || result.ok !== true) say((result && result.error) || `could not run ${id}`);
}

async function openPalette() {
  try {
    paletteRows = (await window.aitherConsole.commands()) || [];
  } catch (error) {
    paletteRows = [];
    say(String((error && error.message) || error));
  }
  paletteCursor = 0;
  paletteInput.value = "";
  scrim.classList.add("open");
  renderPalette();
  paletteInput.focus();
}

function closePalette() {
  scrim.classList.remove("open");
  paletteInput.blur();
}

paletteInput.addEventListener("input", () => { paletteCursor = 0; renderPalette(); });
scrim.addEventListener("mousedown", (event) => { if (event.target === scrim) closePalette(); });
document.addEventListener("keydown", (event) => {
  const open = scrim.classList.contains("open");
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    return void (open ? closePalette() : openPalette());
  }
  if (!open) return;
  if (event.key === "Escape") { event.preventDefault(); return closePalette(); }
  const rows = paletteMatches();
  if (event.key === "ArrowDown") {
    event.preventDefault();
    paletteCursor = rows.length ? (paletteCursor + 1) % rows.length : 0;
    return renderPalette();
  }
  if (event.key === "ArrowUp") {
    event.preventDefault();
    paletteCursor = rows.length ? (paletteCursor - 1 + rows.length) % rows.length : 0;
    return renderPalette();
  }
  if (event.key === "Enter" && rows[paletteCursor]) {
    event.preventDefault();
    return void runPalette(rows[paletteCursor].id);
  }
});

window.aitherConsole.onFocus((payload) => {
  if (!payload || !payload.pane) return;
  const pane = panes.find((p) => p.id === payload.pane);
  if (!pane) return;
  if (payload.param && pane.src) {
    const want = pane.src + (pane.src.includes("?") ? "&" : "?")
      + "card=" + encodeURIComponent(payload.param);
    const frame = document.getElementById("pane-" + pane.id);
    if (frame && frame.tagName === "IFRAME" && frame.src !== want) frame.src = want;
    else if (!frame) pane.src = want;
  }
  select(pane.id);
});

(async function start() {
  try {
    panes = await window.aitherConsole.panes();
  } catch (error) {
    say("could not load panes: " + String(error && error.message ? error.message : error));
    return;
  }
  for (const pane of panes) {
    const tab = document.createElement("button");
    tab.className = "tab";
    tab.id = "tab-" + pane.id;
    tab.setAttribute("aria-selected", "false");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = pane.label;
    const hint = document.createElement("span");
    hint.className = "hint";
    hint.textContent = pane.hint;
    const badge = document.createElement("span");
    badge.className = "badge";
    tab.append(name, hint, badge);
    tab.addEventListener("click", () => select(pane.id));
    rail.appendChild(tab);
  }
  await refreshDetached();
  if (panes.length) select(panes[0].id);
})();
</script>
</body>
</html>
