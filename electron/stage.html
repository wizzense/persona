<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stage</title>
<link rel="stylesheet" href="aither-tokens.css" />
<link rel="stylesheet" href="aither-ui.css" />
<style>
  /* Components (buttons, cards, lists, badges, empty states) come from aither-ui.css,
     colours and type from aither-tokens.css (GENERATED from Veil's tokens by
     AitherOS/dev/tools/gen_desk_tokens.py). This sheet only lays the pane out.
     `.row` and `.chip` stay on the elements as hooks: console-smoke.cjs counts
     `#list .row` and `#arrangements .chip`. */

  /* ONE chrome. Inside the console the shell's bar already names this pane, so the
     pane's own title is the double header from the owner's 2026-09-20 screenshots.
     console-preload.cjs sets .embedded per frame; detached into its own window the
     page is not embedded and keeps its title, because there it is the only one. */
  .embedded .bar .title { display: none; }
  .bar .ui-sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ui-item .ui-grow { display: grid; gap: 2px; }
  #err:empty { display: none; }
</style>
</head>
<body class="ui">
  <header class="ui-head bar">
    <h1 class="title">Stage</h1>
    <span class="ui-sub" id="state">reading the stage…</span>
    <span class="ui-grow"></span>
    <button class="ui-btn ui-small" id="refresh">Refresh</button>
  </header>

  <main class="ui-body">
    <div class="ui-stack">
      <section class="ui-card">
        <div class="ui-card-head"><h2>Arrange</h2></div>
        <div class="ui-row" id="arrangements"></div>
      </section>

      <section class="ui-card">
        <div class="ui-card-head"><h2>On stage</h2><span class="ui-grow"></span><span class="ui-note" id="safety"></span></div>
        <div class="ui-list" id="list"></div>
      </section>

      <p class="ui-note ui-bad" id="err"></p>
      <p class="ui-note">Bodies are also draggable on the stage itself — this pane is the path that needs no aim.</p>
    </div>
  </main>

<script>
"use strict";

// The Stage pane. It holds no geometry and no state: main lists the bodies, the
// renderer places them (src/stage/arrangements.ts). Everything here is a name.
const listEl = document.getElementById("list");
const stateEl = document.getElementById("state");
const errEl = document.getElementById("err");

const ARRANGEMENTS = [
  { id: "row", label: "Line them up" },
  { id: "arc", label: "Gather in an arc" },
  { id: "pair", label: "Face each other" },
  { id: "focus", label: "Focus the selected" },
  { id: "reset", label: "Reset everyone" },
];

let bodies = [];
let selected = null;

function say(message) {
  errEl.textContent = message || "";
}

/** Every call reports; a verb that failed must not look like one that did nothing. */
async function call(promise, what) {
  try {
    const result = await promise;
    if (!result || result.ok !== true) {
      say((result && result.error) || `${what} did not answer`);
      return null;
    }
    say("");
    return result;
  } catch (error) {
    say(`${what}: ${String((error && error.message) || error)}`);
    return null;
  }
}

function renderArrangements() {
  const holder = document.getElementById("arrangements");
  holder.replaceChildren();
  for (const item of ARRANGEMENTS) {
    const button = document.createElement("button");
    button.className = "chip ui-btn";
    button.textContent = item.label;
    button.dataset.arrangement = item.id;
    // `focus` needs a subject; without a selection it would silently focus the
    // resident, which reads as "the button picked the wrong body".
    if (item.id === "focus" && !selected) button.disabled = true;
    button.addEventListener("click", async () => {
      await call(window.aitherStage.arrange(item.id, {
        slotId: item.id === "focus" ? selected : null,
        pair: item.id === "pair" && selected ? [selected] : [],
      }), item.label);
    });
    holder.appendChild(button);
  }
}

function renderBodies() {
  listEl.replaceChildren();
  if (!bodies.length) {
    const empty = document.createElement("div");
    empty.className = "ui-empty";
    const head = document.createElement("strong");
    head.textContent = "Nobody is on the stage";
    const body = document.createElement("span");
    body.textContent = "The resident avatar appears here once the window is open, and room "
      + "agents appear as they speak. Arrangements apply to whoever is standing.";
    empty.append(head, body);
    listEl.appendChild(empty);
    return;
  }
  for (const entry of bodies) {
    const row = document.createElement("div");
    row.className = "row ui-item";

    const who = document.createElement("div");
    who.className = "ui-grow";
    const name = document.createElement("div");
    name.className = "ui-title";
    // WHO first (the agent or session), the body's file name second.
    name.textContent = entry.agent || entry.name || entry.slotId;
    const sub = document.createElement("div");
    sub.className = "ui-meta";
    sub.textContent = [entry.agent ? `body ${entry.name || "?"}` : null, entry.slotId].filter(Boolean).join(" · ");
    who.append(name, sub);

    const tag = document.createElement("span");
    tag.className = "ui-badge" + (entry.resident ? " ui-ok" : "");
    tag.textContent = entry.resident ? "resident" : "room";

    const select = document.createElement("button");
    const isSel = selected === entry.slotId;
    select.className = "chip ui-btn ui-small";
    select.setAttribute("aria-pressed", isSel ? "true" : "false");
    select.textContent = isSel ? "Selected" : "Select";
    select.addEventListener("click", () => {
      selected = selected === entry.slotId ? null : entry.slotId;
      renderBodies();
      renderArrangements();
    });

    const frame = document.createElement("button");
    frame.className = "chip ui-btn ui-small";
    frame.textContent = "Frame";
    frame.addEventListener("click", () => call(window.aitherStage.focus(entry.slotId), "Frame"));

    row.append(who, tag, select, frame);

    // The resident is the desk's own avatar; main refuses to remove it, so the
    // button is not offered rather than offered and refused.
    if (!entry.resident) {
      const remove = document.createElement("button");
      remove.className = "chip ui-btn ui-small ui-danger";
      remove.textContent = "Send away";
      remove.addEventListener("click", async () => {
        if (await call(window.aitherStage.remove(entry.slotId), "Send away")) {
          if (selected === entry.slotId) selected = null;
          void refresh();
        }
      });
      row.appendChild(remove);
    }
    listEl.appendChild(row);
  }
}

async function refresh() {
  const result = await call(window.aitherStage.bodies(), "Bodies");
  bodies = (result && result.bodies) || [];
  if (selected && !bodies.some((b) => b.slotId === selected)) selected = null;
  const safety = (result && result.safety) || null;
  document.getElementById("safety").textContent = safety
    ? `Mature content: ${safety.mature}`
    : "";
  stateEl.textContent = bodies.length
    ? `${bodies.length} on stage`
    : "nobody on stage";
  renderBodies();
  renderArrangements();
}

document.getElementById("refresh").addEventListener("click", () => void refresh());
// A body arrives when a room agent speaks, so the list is polled rather than
// pushed: the pane must not show a stage that emptied five minutes ago.
setInterval(() => void refresh(), 4000);
void refresh();
</script>
</body>
</html>
