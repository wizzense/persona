<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' file:; script-src 'unsafe-inline'; img-src data:;" />
<title>Aither Command</title>
<link rel="stylesheet" href="aither-tokens.css" />
<link rel="stylesheet" href="aither-ui.css" />
<style>
  /* Components (buttons, the input, badges, notes) come from aither-ui.css, colours
     and type from aither-tokens.css (GENERATED from Veil's tokens by
     AitherOS/dev/tools/gen_desk_tokens.py). What stays here is the conversation's
     own layout: a scrolling history above, a composer pinned below. */

  /* ONE chrome. Inside the console the shell's bar already names this pane, so the
     pane's own title is the double header from the owner's 2026-09-20 screenshots.
     console-preload.cjs sets .embedded per frame; detached into its own window the
     page is not embedded and keeps its title, because there it is the only one. */
  .embedded header h1 { display: none; }

  #transcript { height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    padding: 12px max(24px, calc((100% - 880px) / 2)) 16px; }
  /* A conversation, not a ledger. Every turn used to be a FULL-WIDTH bar, so your own
     two-word command ("gpu quiet") rendered as an empty slab with text pinned to the
     far right edge (owner screenshot, 2026-09-20). A bubble is as wide as what it
     says: yours on the right in the theme colour, the answer on the left. */
  .message { padding: 9px 13px; border-radius: 12px; width: fit-content; max-width: min(78%, 760px);
    white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; user-select: text; }
  .message.request { align-self: flex-end; border-bottom-right-radius: 4px;
    background: color-mix(in oklch, var(--brand), var(--background) 62%); }
  .message.progress, .message.reply, .message.fleet-reply, .message.error {
    align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--line);
    background: var(--panel); }
  .message.progress { color: var(--muted); font-family: var(--font-mono); font-size: 12px;
    background: none; border-style: dashed; }
  .message.error { border-color: color-mix(in oklch, var(--bad), var(--background) 55%); }
  .message .verdict { margin-right: 8px; text-transform: uppercase; }
  .message details { margin-top: 6px; }
  .message summary { cursor: pointer; color: var(--muted); font-size: 11px; }
  .message pre { margin: 6px 0 0; font: 11px/1.5 var(--font-mono); color: var(--muted);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  #transcript:empty::before { content: "Say what you want in a sentence -- \201Cis ARC solving?\201D, \201Cquiet the GPU\201D, \201Cwhat is on the fleet?\201D -- or pick a suggestion below."; color: var(--muted); font-size: 12px; margin: auto; text-align: center; max-width: 420px; line-height: 1.6; }

  .composer { flex: none; display: flex; flex-direction: column; gap: 8px;
    padding: 10px max(24px, calc((100% - 880px) / 2)) 14px; border-top: 1px solid var(--line); }
  .composer .box { display: flex; align-items: flex-end; gap: 8px; }
  .composer textarea { resize: none; min-height: 40px; max-height: 150px; }
</style>
</head>
<body class="ui">
  <header class="ui-head">
    <div>
      <h1>Aither Command</h1>
      <div class="ui-sub">Ask in a sentence; the fleet answers here</div>
    </div>
    <span class="ui-grow"></span>
    <span id="queue" class="ui-badge" title="commands queued and waiting">–</span>
    <button class="chip ui-btn ui-small ui-ghost" id="chip-open-fleet" data-action="open-fleet">Open Fleet window</button>
  </header>

  <main class="ui-body ui-flush">
    <div id="transcript"></div>
  </main>

  <div class="composer">
    <div class="ui-row" aria-label="suggestions">
      <button class="chip ui-btn ui-small" id="chip-fleet-status" data-text="fleet status">Fleet status</button>
      <button class="chip ui-btn ui-small" id="chip-fleet-down" data-text="fleet down">Fleet down</button>
      <button class="chip ui-btn ui-small" id="chip-fleet-up" data-text="fleet up">Fleet up</button>
      <button class="chip ui-btn ui-small" id="chip-gpu-quiet" data-text="gpu quiet">GPU quiet</button>
      <button class="chip ui-btn ui-small" id="chip-gpu-resume" data-text="gpu resume">GPU resume</button>
    </div>
    <div class="box">
      <textarea id="input" class="ui-input" rows="1" placeholder="Message Aither…" spellcheck="false"></textarea>
      <button id="send" class="ui-btn ui-primary" title="Send (Enter)">Send</button>
    </div>
    <span id="help" class="ui-note">Enter to send · Shift+Enter for a newline · Esc to close</span>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const transcript = $("transcript");
  const input = $("input");
  const sendBtn = $("send");
  const queueIndicator = $("queue");
  const chips = [...document.querySelectorAll(".chip")];
  let queueLength = 0;
  let isInputting = false;

  /**
   * A fleet verb answers with its raw result object -- the owner's screen read
   *   Fleet gaming: {"error": "podman ps failed: Command '['podman', 'ps', ...", "verdict": "CANNOT_JUDGE"}
   * That is a log line, not an answer. Split it: the VERDICT as a chip, the reason
   * as a sentence, the object behind a disclosure for when it is actually wanted.
   */
  function humanise(text) {
    const at = String(text).indexOf(": {");
    if (at < 0) return null;
    let data;
    try { data = JSON.parse(String(text).slice(at + 2)); } catch { return null; }
    if (!data || typeof data !== "object") return null;
    const verdict = String(data.verdict || (data.error ? "error" : data.ok === false ? "failed" : "")).replace(/_/g, " ");
    const reason = String(data.error || data.message || data.detail || data.summary || "")
      .replace(/Command '\[([^\]]*)\]'/, (_m, argv) => "`" + argv.replace(/['",]/g, "").replace(/\s+/g, " ").trim() + "`");
    return { head: String(text).slice(0, at), verdict, reason, data };
  }

  function addMessage(text, kind) {
    const msg = document.createElement("div");
    msg.className = `message ${kind}`;
    const parsed = humanise(text);
    if (!parsed) {
      msg.textContent = text;
    } else {
      if (parsed.verdict) {
        const chip = document.createElement("span");
        const bad = /cannot|error|fail|down|dead/i.test(parsed.verdict);
        chip.className = "verdict ui-badge" + (bad ? " ui-bad" : /ok|up|clean|pass/i.test(parsed.verdict) ? " ui-ok" : "");
        chip.textContent = parsed.verdict;
        msg.appendChild(chip);
      }
      msg.appendChild(document.createTextNode(parsed.head + (parsed.reason ? " — " + parsed.reason : "")));
      const more = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "raw result";
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(parsed.data, null, 2);
      more.append(summary, pre);
      msg.appendChild(more);
    }
    transcript.appendChild(msg);
    while (transcript.childElementCount > 500) transcript.removeChild(transcript.firstChild);
    transcript.scrollTop = transcript.scrollHeight;
  }

  /** The composer grows with what is typed, up to its max-height, like any chat box. */
  function grow() {
    input.style.height = "auto";
    input.style.height = `${input.scrollHeight + 2}px`;
  }

  function updateQueue(len) {
    queueLength = len;
    queueIndicator.textContent = len > 0 ? `${len} queued` : "–";
    queueIndicator.classList.toggle("active", len > 0);
    queueIndicator.classList.toggle("ui-warn", len > 0);
    for (const chip of chips) chip.disabled = len > 0 || isInputting;
    input.disabled = len > 0 || isInputting;
    sendBtn.disabled = input.disabled;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    grow();
    isInputting = true;
    for (const chip of chips) chip.disabled = true;
    sendBtn.disabled = true;
    addMessage(text, "request");
    try {
      const result = await window.command.send(text);
      addMessage(result.reply, result.kind === "fleet" ? "fleet-reply" : result.ok ? "reply" : "error");
    } catch (error) {
      addMessage(`Error: ${error?.message || String(error)}`, "error");
    } finally {
      isInputting = false;
      updateQueue(queueLength);
      input.focus();
    }
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      void send();
    } else if (e.key === "Escape") {
      window.command.close();
    }
  });
  input.addEventListener("input", grow);
  sendBtn.addEventListener("click", () => void send());

  for (const chip of chips) {
    if (chip.dataset.text) {
      chip.addEventListener("click", () => {
        input.value = chip.dataset.text;
        input.focus();
        void send();
      });
    } else if (chip.dataset.action === "open-fleet") {
      chip.addEventListener("click", () => {
        window.command.openFleet();
      });
    }
  }

  window.command.onProgress((p) => {
    if (!p) return;
    if (p.phase === "start") {
      isInputting = true;
      updateQueue(queueLength);
    } else if (p.phase === "run") {
      addMessage(p.text, "progress");
    } else if (p.phase === "end") {
      isInputting = false;
      updateQueue(queueLength);
    }
  });

  async function loadHistory() {
    try {
      const entries = await window.command.history(20);
      for (const entry of entries) {
        if (entry.text) addMessage(entry.text, "request");
        if (entry.reply) {
          const kind = entry.kind === "fleet" ? "fleet-reply" : entry.verdict?.ok === false ? "error" : "reply";
          addMessage(entry.reply, kind);
        }
      }
    } catch {
      // Silently fail
    }
  }

  void loadHistory();
})();
</script>
</body>
</html>
