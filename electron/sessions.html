<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sessions</title>
<link rel="stylesheet" href="aither-tokens.css" />
<style>
  /* Colours, type and scrollbars come from aither-tokens.css -- GENERATED from Veil's
     tokens by AitherOS/dev/tools/gen_desk_tokens.py. This pane used to re-declare its
     own --bg/--panel/--line/--fg palette by hand; five panes did, none matched the
     family. What stays here is only what this pane MEANS by a colour. */
  :root {
    --amber: var(--warning);
    --red: var(--destructive);
    --green: var(--success);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 var(--font-sans); }
  body { display: grid; grid-template-rows: 44px 1fr; height: 100vh; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 0 14px;
    border-bottom: 1px solid var(--line); }
  /* ONE chrome. Inside the console the shell's bar already names this pane, so the
     pane's own title is the double header from the owner's 2026-09-20 screenshots.
     console-preload.cjs sets .embedded per frame; detached into its own window the
     page is not embedded and keeps its title, because there it is the only one. */
  .embedded .bar .title { display: none; }
  .bar .title { font-weight: 600; }
  .bar .state { color: var(--muted); font-size: 12px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { appearance: none; border: 1px solid var(--line); background: var(--btn);
    color: var(--muted); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .chip:hover { background: var(--btn-hi); color: var(--fg); }

  main { display: grid; grid-template-columns: minmax(320px, 34%) 1fr; min-height: 0; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; min-height: 0; }
  /* Sessions are grouped by what they need from YOU, because that is the question
     the pane exists to answer. It used to be one flat list in directory order. */
  .group { position: sticky; top: 0; z-index: 1; background: var(--bg-deep); color: var(--surface-400);
    font-size: 10px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
    padding: 8px 12px 6px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .group .n { color: var(--muted); font-weight: 500; }
  .group.needs { color: var(--warn); }
  .row { padding: 9px 12px; border-bottom: 1px solid var(--btn); cursor: pointer;
    display: grid; gap: 3px; }
  .row:hover { background: var(--btn); }
  .row.sel { background: var(--panel); border-left: 2px solid var(--brand); padding-left: 10px; }
  .row .top { display: flex; align-items: baseline; gap: 8px; }
  /* The name is WHAT the session is about, and it wraps. Every row used to open with
     the same "AitherOS-Fresh develop 07:34 - waiting for you - " and then cut off --
     eighteen rows that read identically, behind a horizontal scrollbar. */
  .row .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .age { color: var(--muted); font-size: 11px; }
  .row .sum { color: var(--muted); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 10px; border-radius: 999px; padding: 1px 7px; border: 1px solid var(--line);
    color: var(--muted); white-space: nowrap; }
  .pill.working { color: var(--brand); border-color: color-mix(in oklch, var(--brand), var(--background) 60%); }
  .pill.waiting { color: var(--amber); border-color: color-mix(in oklch, var(--warn), var(--background) 60%); }
  .pill.exited { opacity: .55; }
  .pill.steer { color: var(--green); border-color: color-mix(in oklch, var(--ok), var(--background) 62%); }
  .pill.steer.turn { color: var(--amber); border-color: color-mix(in oklch, var(--warn), var(--background) 60%); }
  .pill.steer.none { color: var(--muted); opacity: .7; }

  #side { display: grid; grid-template-rows: 34px 1fr; min-height: 0; }
  #tailBar { display: flex; align-items: center; gap: 10px; padding: 0 12px;
    border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  #tailBar .grow { flex: 1; }
  #tail { margin: 0; padding: 10px 14px; overflow: auto; min-height: 0; white-space: pre-wrap;
    word-break: break-word; font: 12px/1.5 var(--font-mono); }
  #tail .role { color: var(--brand); }
  #tail .tool { color: var(--amber); }
  #tail .dim { color: var(--muted); }
  .placeholder { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">Sessions</span>
    <span class="state" id="state">loading…</span>
    <button class="chip" id="refresh">Refresh</button>
  </div>
  <main>
    <div id="list"><div class="placeholder">loading sessions…</div></div>
    <div id="side">
      <div id="tailBar">
        <span id="tailWho">No session selected</span>
        <span class="grow"></span>
        <span id="tailNote"></span>
      </div>
      <pre id="tail" class="placeholder">Pick a session to watch its transcript live.</pre>
    </div>
  </main>

<script>
"use strict";
// The Sessions pane — slice 1 of COCKPIT-DESIGN: OBSERVE, never steer. Rows
// carry each session's steer_capability so a later slice can honestly enable
// steering only where the daemon can deliver it. All content is rendered with
// textContent: a transcript is model output and is DATA, never markup.

const listEl = document.getElementById("list");
const stateEl = document.getElementById("state");
const tailEl = document.getElementById("tail");
const tailWho = document.getElementById("tailWho");
const tailNote = document.getElementById("tailNote");

let sessions = [];
let selected = null; // session object
let pinnedToBottom = true;

function say(text) { stateEl.textContent = text || ""; }

function ageOf(ts) {
  if (!ts) return "";
  const ms = ts > 1e12 ? ts : ts * 1000; // the daemon documents unix seconds
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

function pill(text, cls) {
  const el = document.createElement("span");
  el.className = "pill" + (cls ? " " + cls : "");
  el.textContent = text;
  return el;
}

function statusClass(status) {
  const s = String(status || "");
  if (s === "working") return "working";
  if (s.startsWith("waiting")) return "waiting";
  if (s === "exited") return "exited";
  return "";
}

function steerPill(cap) {
  const c = String(cap || "none");
  if (c === "full") return pill("steerable", "steer");
  if (c === "turn-boundary") return pill("steer @ turn", "steer turn");
  return pill("watch only", "steer none");
}

/**
 * A session title is "<repo> <branch> <HH:MM> - <needs-you?> - <last human prompt>"
 * (room-actor naming). The repo/branch/time is the SAME on nearly every row, so as a
 * heading it made eighteen rows indistinguishable. Split it: `about` is the prompt
 * (what tells sessions apart), `where` is the rest, shown small.
 */
function splitTitle(title) {
  const parts = String(title || "").split(" - ");
  if (parts.length < 2) return { about: String(title || ""), where: "" };
  const where = parts.shift();
  const rest = parts.filter((part) => !/^(waiting for you|maybe blocked|working|idle)$/i.test(part.trim()));
  return { about: (rest.length ? rest : parts).join(" - "), where };
}

/** needs-you first, then working, then the rest: the order of who is waiting on whom. */
function groupOf(session) {
  const status = String(session.status || "");
  const title = String(session.title || "");
  if (status.startsWith("waiting") || /waiting for you|maybe blocked/i.test(title)) return "needs";
  if (status === "working") return "working";
  return "quiet";
}
const GROUP_LABELS = { needs: "Needs you", working: "Working", quiet: "Quiet" };

function renderList() {
  listEl.textContent = "";
  if (!sessions.length) {
    const ph = document.createElement("div");
    ph.className = "placeholder";
    ph.textContent = "No sessions in the directory.";
    listEl.appendChild(ph);
    return;
  }
  const ordered = ["needs", "working", "quiet"].flatMap((group) =>
    sessions.filter((session) => groupOf(session) === group).map((session) => ({ group, session })));
  let lastGroup = null;
  for (const { group, session: s } of ordered) {
    if (group !== lastGroup) {
      lastGroup = group;
      const heading = document.createElement("div");
      heading.className = "group" + (group === "needs" ? " needs" : "");
      const count = ordered.filter((entry) => entry.group === group).length;
      heading.innerHTML = "";
      heading.append(document.createTextNode(GROUP_LABELS[group]));
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = String(count);
      heading.appendChild(n);
      listEl.appendChild(heading);
    }
    const row = document.createElement("div");
    row.className = "row" + (selected && selected.id === s.id ? " sel" : "");
    const top = document.createElement("div");
    top.className = "top";
    const name = document.createElement("span");
    name.className = "name";
    const split = splitTitle(s.title);
    name.textContent = split.about || String(s.id || "").slice(0, 8);
    name.title = (s.cwd || "") + (s.harness_label ? " · " + s.harness_label : "") + (s.origin ? " · " + s.origin : "");
    const age = document.createElement("span");
    age.className = "age";
    age.textContent = ageOf(s.last_activity_at);
    top.append(name, pill(String(s.status || "?"), statusClass(s.status)), age);
    const sum = document.createElement("div");
    sum.className = "sum";
    sum.textContent = [split.where, s.last_activity_summary || s.cwd || ""].filter(Boolean).join("  ·  ");
    row.append(top, sum);
    const badges = document.createElement("div");
    badges.className = "top";
    badges.append(steerPill(s.steer_capability));
    row.appendChild(badges);
    row.addEventListener("click", () => select(s));
    listEl.appendChild(row);
  }
}

function select(s) {
  selected = s;
  pinnedToBottom = true;
  tailWho.textContent = s.title || s.id;
  tailEl.textContent = "loading…";
  renderList();
  void refreshTail();
}

/** JSONL line -> one readable line, or null to skip. Transcript rows are whole
 *  events; printing raw JSON would be a wall nobody reads. */
function formatLine(raw) {
  try {
    const o = JSON.parse(raw);
    if (o.type === "assistant" && o.message && Array.isArray(o.message.content)) {
      const parts = [];
      for (const b of o.message.content) {
        if (b.type === "text" && b.text) parts.push(["A", b.text]);
        else if (b.type === "tool_use") parts.push(["T", b.name]);
      }
      if (parts.length) return parts;
    }
    if (o.type === "user" && o.message && typeof o.message.content === "string") {
      return [["U", o.message.content.slice(0, 400)]];
    }
    if (o.type === "result" && typeof o.result === "string") return [["R", o.result.slice(0, 600)]];
    return null;
  } catch {
    return [["?", raw.slice(0, 300)]];
  }
}

function renderTail(result) {
  tailEl.classList.remove("placeholder");
  tailEl.textContent = "";
  if (!result || result.ok !== true) {
    tailNote.textContent = "";
    tailEl.classList.add("placeholder");
    tailEl.textContent = (result && result.note) || "cannot read the transcript";
    return;
  }
  tailNote.textContent = result.truncated ? "tail (windowed)" : "full";
  for (const raw of result.lines) {
    const parts = formatLine(raw);
    if (!parts) continue;
    for (const [kind, text] of parts) {
      const line = document.createElement("div");
      const tag = document.createElement("span");
      tag.className = kind === "T" ? "tool" : kind === "?" ? "dim" : "role";
      tag.textContent = kind === "A" ? "assistant: " : kind === "U" ? "you: " : kind === "T" ? "⚙ " : kind === "R" ? "result: " : "";
      const body = document.createElement("span");
      body.textContent = text;
      line.append(tag, body);
      tailEl.appendChild(line);
    }
  }
  if (pinnedToBottom) tailEl.scrollTop = tailEl.scrollHeight;
}

tailEl.addEventListener("scroll", () => {
  pinnedToBottom = tailEl.scrollHeight - tailEl.scrollTop - tailEl.clientHeight < 24;
});

async function refreshList() {
  try {
    const result = await window.aitherSessions.list();
    if (!result || result.ok !== true) {
      say((result && result.note) || "daemon unreachable");
      sessions = [];
      renderList();
      return;
    }
    sessions = result.sessions || [];
    say(result.note + " — " + new Date().toLocaleTimeString());
    if (!selected && sessions.length) {
      // Land on the session most likely to be the reason the pane was opened.
      const first = ["needs", "working", "quiet"].map((g) => sessions.find((x) => groupOf(x) === g)).find(Boolean);
      if (first) { select(first); return; }
    }
    if (selected) {
      const fresh = sessions.find((s) => s.id === selected.id);
      if (fresh) selected = fresh; // keep the tail open across refreshes
    }
    renderList();
  } catch (error) {
    say("list failed: " + String((error && error.message) || error));
  }
}

async function refreshTail() {
  if (!selected) return;
  try {
    const result = await window.aitherSessions.tail(selected.id, selected.transcript_path);
    renderTail(result);
  } catch (error) {
    renderTail({ ok: false, note: "tail failed: " + String((error && error.message) || error) });
  }
}

document.getElementById("refresh").addEventListener("click", () => { void refreshList(); void refreshTail(); });

void refreshList();
setInterval(() => { void refreshList(); }, 5000);
setInterval(() => { void refreshTail(); }, 2500);
</script>
</body>
</html>
